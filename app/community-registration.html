<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLE Community Registration</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f3f7f3;
margin:0;
padding:0;
}

header{
background:#0b6b2a;
color:white;
padding:20px;
text-align:center;
}

.container{

max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);

}

.section{

margin-top:25px;

}

.section h2{

color:#0b6b2a;

border-bottom:2px solid #0b6b2a;

padding-bottom:8px;

}

label{

display:block;

margin-top:15px;

font-weight:bold;

}

input,

select,

textarea{

width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ccc;

border-radius:8px;

box-sizing:border-box;

}

button{

margin-top:25px;

padding:12px;

width:100%;

background:#0b6b2a;

color:white;

border:none;

border-radius:8px;

font-size:18px;

cursor:pointer;

}

button:hover{

background:#095221;

}

.footer{

margin-top:40px;

text-align:center;

font-size:14px;

color:#666;

}

</style>

</head>

<body>

<header>

<h1>🌿 BLE Community Registration</h1>

<p>अपणी गोर बोली — अपणी पहचान</p>

</header>

<div class="container">

<div class="section">

<h2>व्यक्तिगत जानकारी</h2>

<label>पूरा नाम</label>

<input type="text" id="name">

<label>पिता / माता का नाम</label>

<input type="text" id="parent">

<label>जन्म तिथि</label>

<input type="date" id="dob">

<label>लिंग</label>

<select id="gender">

<option>पुरुष</option>

<option>महिला</option>

<option>अन्य</option>

</select>

</div>

<div class="section">

<h2>समुदाय की जानकारी</h2>

<label>समुदाय</label>

<select id="community">

<option>बंजारा</option>

<option>विमुक्त</option>

<option>घुमक्कड़</option>

<option>अन्य</option>

</select>

<label>जाति</label>

<input list="casteList" id="caste">

<datalist id="casteList">

<option>बंजारा</option>

<option>लमानी</option>

<option>लबाना</option>

<option>सुगाली</option>

<option>सिकलीगर</option>

</datalist>

<label>गोत्र</label>

<input list="gotraList" id="gotra">

<datalist id="gotraList">

<option>राठौड़</option>

<option>चौहान</option>

<option>पवार</option>

<option>वडतिया</option>

<option>बन्नोथ</option>

</datalist>

<label>पाड़ा / उपगोत्र</label>

<input type="text" id="pada">

</div>

<div class="section">

<h2>पता</h2>

<label>देश</label>

<input type="text" value="भारत">

<label>राज्य</label>

<input type="text" id="state">

<label>जिला</label>

<input type="text" id="district">

<label>गांव / शहर</label>

<input type="text" id="village">

</div>

<div class="section">

<h2>संपर्क</h2>

<label>मोबाइल</label>

<input type="tel" id="mobile">

<label>WhatsApp</label>

<input type="tel" id="whatsapp">

<label>Email</label>

<input type="email" id="email">

</div>

<div class="section">

<h2>संकल्प</h2>

<label>

<input type="checkbox" id="pledge">

मैं BLE Community Pledge का पालन करने का संकल्प लेता/लेती हूँ।

</label>

</div>

<button onclick="submitRegistration()">

Register Member

</button>

</div>

<div class="footer">

© GBSBFORYOU | BLE v1.0

</div>

<script>

function submitRegistration(){

alert("Version 1.0\n\nअगले चरण में यह डेटा Google Sheets में सेव होगा।");

}

</script>

</body>

  </html>
